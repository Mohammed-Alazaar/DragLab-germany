services:
  - type: web
    name: draglab-germany
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_USER
        sync: false
      - key: MONGO_PASSWORD
        sync: false
      - key: MONGO_DATABASE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: EMAIL_DELIVERY_ENABLED
        value: "false"
      - key: RECAPTCHA_ENABLED
        value: "false"
